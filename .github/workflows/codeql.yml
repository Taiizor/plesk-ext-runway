name: CodeQL

# Static analysis of the root helper (Python), the frontend (JavaScript) and the workflow files
# (GitHub Actions) with the security-extended query suite: on every push and pull request that
# changes code, and once a week to pick up new queries. Results: the Security tab, "Code scanning".
on:
  push:
    branches: [develop]
    paths: ["**", "!docs/**", "!*.md", "!LICENSE"]
  pull_request:
    paths: ["**", "!docs/**", "!*.md", "!LICENSE"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
