name: CodeQL

# Static analysis of the root helper (Python), the frontend (JavaScript) and the workflow files
# (GitHub Actions) with the security-extended query suite: on every push and pull request that
# changes code, and once a week to pick up new queries. Results: the Security tab, "Code scanning".
on:
  push:
    branches: [develop]
    paths: ["**", "!docs/**", "!*.md", "!LICENSE"]
  pull_request:
    paths: ["**", "!docs/**", "!*.md", "!LICENSE"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            query-filters:
              # The helper sets deliberate group/world-readable modes: root-owned read-only
              # toolchain trees (0755/0644), user-owned application files (0750) and the
              # web-server-group socket of the Python example. The query reports every mode
              # that grants anything to group or others, so it only produces noise here;
              # the modes were reviewed in docs/REVIEW-REPORT.md and SECURITY.md.
              - exclude:
                  id: py/overly-permissive-file

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
