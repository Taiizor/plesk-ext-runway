name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-R for a repackaged release) to build, test and publish a GitHub
# release with the installable zip. The whole CI (lint, package, end-to-end tests) must pass
# first. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3 or v1.2.3-4"
            exit 1
          fi
          base="${version%%-*}"
          meta=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' src/meta.xml)
          if [ "$meta" != "$base" ]; then
            echo "::error::src/meta.xml has version $meta but the tag is $GITHUB_REF_NAME: bump src/meta.xml, package.json and the helper's VERSION first (docs/RELEASING.md)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: GitHub release
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BASE: ${{ needs.version.outputs.base }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: runway-package
          path: dist

      - name: Verify the tested package
        run: |
          ls -l dist
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then echo "::error::expected one package, found ${#zips[@]}"; exit 1; fi
          python build.py --verify "${zips[0]}" --version "$VERSION"
          echo "PACKAGE=$(basename "${zips[0]}")" >> "$GITHUB_ENV"
          (cd dist && sha256sum -- *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os
          import re

          base = os.environ["BASE"]
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              text = fh.read()
          match = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)" % re.escape(base),
                            text, re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit("CHANGELOG.md has no section for %s" % base)
          notes = match.group(1).strip()
          package = os.environ["PACKAGE"]
          notes += ("\n\n### Install\n\nDownload `%s` and run, as root on the Plesk server:\n\n"
                    "```sh\nplesk bin extension --upgrade %s\n```\n\n"
                    "`SHA256SUMS` lists the checksum of the package. Documentation: "
                    "https://github.com/Taiizor/plesk-ext-runway#readme\n" % (package, package))
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(notes)
          print(notes)
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "Runway $VERSION" --notes-file release-notes.md --verify-tag
