name: Bug report
description: Something does not work as documented
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems (one customer reaching another, anything that runs as root) go through
        [private vulnerability reporting](https://github.com/Taiizor/plesk-ext-runway/security/advisories/new), not here.
        Please remove secrets, customer names and real domains from everything you paste.

  - type: input
    id: runway
    attributes:
      label: Runway version
      description: "*Extensions > My Extensions*, or `plesk bin extension --list`."
      placeholder: 1.0.0-1
    validations:
      required: true

  - type: input
    id: plesk
    attributes:
      label: Plesk version and operating system
      description: "`plesk version` (the first two lines)."
      placeholder: Plesk Obsidian 18.0.82, Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      multiple: true
      options:
        - Go
        - Rust
        - Bun
        - Java
        - .NET
        - Python
        - Ruby
        - PHP
        - Binary
        - Not runtime specific

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Domain page (application settings, start/stop, build)
        - Deployments and trigger files (tmp/deploy.txt, Git)
        - Web server proxy (nginx, Apache, WebSockets, static paths)
        - Toolchains
        - Server settings or overview
        - Command line (plesk ext runway)
        - Installation, upgrade or uninstall
        - Customer access and permissions
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Settings of the application (runtime, listen mode, proxy mode, build and start commands) and the actions in order.
      placeholder: |
        1. Toolchains: install Go 1.27.4
        2. Domain page: runtime Go, listen Unix socket, enable, save
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines of `/var/log/plesk/panel.log`, `journalctl -u runway-app-<id>` (or `runway-deploy-<id>`),
        `/var/lib/runway/jobs/*.log`, `plesk ext runway --status <domain>`, and the browser console for problems in the panel.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security problem (those go through SECURITY.md).
          required: true
